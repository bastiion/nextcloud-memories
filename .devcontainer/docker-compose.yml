name: memories_dev

volumes:
  config:
  data:
  database:
  nginx_certs:


services:
  nginx-proxy:
    image: nginx:alpine
    restart: no
    ports:
      - "8443:443"
    volumes:
      - nginx_certs:/etc/nginx/certs
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nextcloud
    command: >
      sh -c " if [ ! -f /etc/nginx/certs/localhost.crt ]; then
        apk add --no-cache openssl &&
        openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /etc/nginx/certs/localhost.key -out /etc/nginx/certs/localhost.crt -subj '/C=US/ST=CA/L=Dev/O=Memories/CN=localhost'
      fi && exec nginx -g 'daemon off;' "

  nextcloud:
    build:
      context: .
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    depends_on:
      - db
      - redis
    volumes:
      - ../:/var/www/html/custom_apps/memories:rw
      - config:/var/www/html/config:rw
      - data:/var/www/html/data:rw
    environment:
      - TZ=America/Los_Angeles
      - MYSQL_PASSWORD=nextcloud
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_HOST=db
      - REDIS_HOST=redis
      - OVERWRITEPROTOCOL=https
      - OVERWRITEHOST=localhost:8443
      - PHP_MEMORY_LIMIT=1G
      - PHP_UPLOAD_LIMIT=1G
      - DEBIAN_FRONTEND=noninteractive
    expose:
      - "80"
    ports:
      - "8080:8080"

  db:
    image: mariadb:11
    restart: no
    pull_policy: always
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW --log_bin_trust_function_creators=1
    volumes:
      - database:/var/lib/mysql:rw
    environment:
      - MYSQL_ROOT_PASSWORD=nextcloud
      - MYSQL_PASSWORD=nextcloud
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MARIADB_AUTO_UPGRADE=1
      - MARIADB_INITDB_SKIP_TZINFO=1

  adminer:
    image: adminer
    restart: no
    network_mode: service:nextcloud

  redis:
    image: redis:alpine
    pull_policy: always
    restart: no
